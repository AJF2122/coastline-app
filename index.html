<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Coastline — SoCal Water Conditions</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --ink:#153042;
  --muted:#718590;
  --line:#dce7eb;
  --panel:#fbfdfe;
  --blue:#0e89c8;
  --green:#24a861;
  --yellow:#e3c53d;
  --orange:#ee8b32;
  --red:#df4d52;
  --gray:#9aa8ae;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dfeaec;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}
button{color:inherit}
.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#bfd9e3;
}
#map{position:absolute;inset:0;background:#bfd9e3}
.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{
  font-size:7px!important;
  max-width:62vw;
  margin-bottom:76px!important;
  background:rgba(255,255,255,.72)!important;
  color:#5f7681!important;
}
.leaflet-tooltip{
  border:0!important;
  border-radius:11px!important;
  padding:7px 9px!important;
  box-shadow:0 5px 18px rgba(24,52,65,.16)!important;
  font-size:11px!important;
}
.map-wash{
  position:absolute;inset:0;z-index:350;pointer-events:none;
  background:
    radial-gradient(circle at 70% 72%,rgba(14,137,200,.08),transparent 27%),
    radial-gradient(circle at 30% 82%,rgba(36,168,97,.05),transparent 30%);
}

/* TOP BAR */
.topbar{
  position:absolute;
  z-index:800;
  top:calc(8px + var(--safe-top));
  left:10px;right:10px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  pointer-events:none;
}
.brand,.icon-btn{
  pointer-events:auto;
  background:rgba(255,255,255,.95);
  border:1px solid rgba(215,228,234,.96);
  box-shadow:0 5px 18px rgba(22,55,70,.12);
  backdrop-filter:blur(14px);
}
.brand{
  height:44px;border-radius:14px;padding:0 11px 0 7px;
  display:flex;align-items:center;gap:8px;
}
.brand-mark{
  width:31px;height:31px;border-radius:10px;
  background:linear-gradient(145deg,#2ab5df,#0878b9);
  color:white;display:grid;place-items:center;
}
.brand-name{font-weight:800;font-size:13px;letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:8.5px;color:var(--muted);margin-top:3px}
.top-actions{display:flex;gap:6px;pointer-events:auto}
.icon-btn{
  width:44px;height:44px;border:0;border-radius:14px;display:grid;place-items:center;cursor:pointer
}
.icon-btn:active,.layer-btn:active,.mode button:active,.region-pill:active,.row-card:active,.nav-btn:active{transform:scale(.96)}

/* STATUS CHIP */
.status-chip{
  position:absolute;z-index:690;
  left:10px;
  top:calc(62px + var(--safe-top));
  background:rgba(255,255,255,.92);
  border:1px solid rgba(215,228,234,.94);
  border-radius:13px;
  padding:8px 10px;
  box-shadow:0 5px 18px rgba(22,55,70,.10);
  backdrop-filter:blur(12px);
}
.status-chip strong{font-size:10px;display:flex;align-items:center;gap:5px}
.status-chip small{display:block;font-size:8px;color:var(--muted);margin-top:2px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--yellow)}

/* RIGHT LAYER BUTTONS */
.layers{
  position:absolute;
  z-index:790;
  right:10px;
  top:calc(67px + var(--safe-top));
  display:grid;gap:7px;
}
.layer-btn{
  width:48px;height:48px;
  border:1px solid rgba(215,228,234,.95);
  border-radius:14px;
  background:rgba(255,255,255,.95);
  box-shadow:0 5px 18px rgba(22,55,70,.11);
  display:grid;place-items:center;
  cursor:pointer;backdrop-filter:blur(12px);
  padding:3px 0;
}
.layer-btn.active{background:#eaf7fc;color:#087fba;border-color:#b9dfef}
.layer-btn svg{display:block;width:20px;height:20px}
.layer-btn span{font-size:6.8px;font-weight:900;letter-spacing:.02em;line-height:1;margin-top:1px}

/* MAP MARKERS */
.pin-wrap{
  width:38px;height:43px;position:relative;
  filter:drop-shadow(0 4px 6px rgba(26,58,72,.18));
}
.pin-circle{
  position:absolute;left:4px;top:2px;width:30px;height:30px;
  border-radius:50%;background:#fff;border:3px solid var(--pin);
  display:grid;place-items:center;color:var(--pin);
}
.pin-tail{
  position:absolute;left:15px;top:29px;width:8px;height:8px;
  background:#fff;border-right:3px solid var(--pin);border-bottom:3px solid var(--pin);
  transform:rotate(45deg);border-radius:0 0 2px 0;
}
.pin-circle svg{width:18px;height:18px;position:relative;z-index:2}
.pin-speed{
  position:absolute;left:50%;top:35px;transform:translateX(-50%);
  white-space:nowrap;font-size:7px;font-weight:900;color:#35515f;
  background:rgba(255,255,255,.93);border-radius:999px;padding:1px 4px;
  border:1px solid #dce7eb;
}
.user-dot{
  width:16px;height:16px;border-radius:50%;
  background:#168bd0;border:3px solid #fff;
  box-shadow:0 0 0 4px rgba(22,139,208,.18),0 3px 8px rgba(18,60,80,.24)
}

/* BOTTOM SHEET */
.sheet{
  --sheet-h:205px;
  position:absolute;z-index:900;left:0;right:0;
  bottom:calc(64px + var(--safe-bottom));
  height:var(--sheet-h);
  min-height:156px;
  max-height:74dvh;
  background:rgba(251,253,254,.985);
  border:1px solid rgba(218,231,236,.98);
  border-bottom:0;
  border-radius:24px 24px 0 0;
  box-shadow:0 -8px 30px rgba(18,49,64,.14);
  backdrop-filter:blur(18px);
  overflow:hidden;
  transition:height .26s cubic-bezier(.2,.8,.2,1);
}
.sheet.dragging{transition:none}
.handle{
  height:27px;display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:grab;
}
.grabber{width:38px;height:4px;border-radius:999px;background:#cbd8dd}
.sheet-body{height:calc(100% - 27px);overflow:auto;padding:0 12px 14px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.eyebrow{font-size:8.5px;font-weight:900;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.sheet-title{font-size:18px;font-weight:850;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sheet-sub{font-size:8.7px;color:var(--muted);margin-top:2px}
.mode{display:flex;background:#e8f0f3;border-radius:12px;padding:3px}
.mode button{
  border:0;background:transparent;border-radius:9px;padding:7px 10px;
  font-size:10px;font-weight:850;cursor:pointer
}
.mode button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(25,54,67,.10)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}
.metric{background:#f1f6f8;border-radius:10px;padding:7px 6px;min-width:0}
.metric span{display:block;font-size:7.2px;color:#81919a;font-weight:850;text-transform:uppercase}
.metric b{display:block;font-size:11.5px;margin-top:2px;white-space:nowrap}
.section-head{
  border-top:1px solid #edf2f4;padding-top:10px;margin-top:2px;
  display:flex;justify-content:space-between;align-items:center;gap:8px
}
.section-head strong{font-size:13px}
.section-head small{display:block;font-size:8.3px;color:var(--muted);margin-top:2px}
.viewall{border:0;background:transparent;color:var(--blue);font-size:8.5px;font-weight:900;padding:7px;cursor:pointer}
.regions{display:flex;gap:6px;overflow:auto;padding:9px 0 8px;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.region-pill{
  white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 10px;font-size:8.7px;font-weight:750;color:#627782;cursor:pointer
}
.region-pill.active{background:#e5f4fb;color:#087db8;border-color:#bee3f2}
.list{display:grid;gap:7px;padding-bottom:12px}
.row-card{
  background:#fff;border:1px solid #e1eaee;border-radius:15px;padding:10px;
  box-shadow:0 3px 12px rgba(24,57,72,.05);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;cursor:pointer
}
.row-name{font-size:12px;font-weight:850;letter-spacing:-.015em}
.row-sub{font-size:8.4px;color:var(--muted);margin-top:2px}
.row-data{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px}
.row-data span{font-size:7.8px;color:#7a8d96}
.row-data b{font-size:9.7px;color:#294756}
.badge{align-self:start;border-radius:999px;padding:5px 7px;font-size:7.7px;font-weight:900}
.good{background:#e6f7ee;color:#11794b}
.fair{background:#fff6d9;color:#956d00}
.poor{background:#ffeddf;color:#a5520d}
.alert{background:#fde8e9;color:#ad3439}
.neutral{background:#edf2f4;color:#687d87}

/* BOTTOM NAV */
.bottom-nav{
  position:absolute;z-index:1000;left:0;right:0;bottom:0;
  height:calc(64px + var(--safe-bottom));
  padding:5px 10px var(--safe-bottom);
  background:rgba(255,255,255,.985);
  border-top:1px solid #dfe9ed;
  display:grid;grid-template-columns:repeat(4,1fr);
  box-shadow:0 -4px 18px rgba(19,50,65,.07);
}
.nav-btn{
  border:0;background:transparent;border-radius:13px;display:grid;place-items:center;
  align-content:center;gap:2px;color:#80919a;font-size:8px;font-weight:850;cursor:pointer
}
.nav-btn.active{color:var(--blue);background:#edf8fc}
.nav-btn svg{width:18px;height:18px}

/* DETAIL MODAL */
.modal{
  position:absolute;inset:0;z-index:1500;background:rgba(11,34,45,.28);
  display:none;align-items:flex-end;
}
.detail{
  width:100%;max-height:87dvh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;
  padding:10px 14px calc(18px + var(--safe-bottom));box-shadow:0 -15px 45px rgba(16,45,58,.20)
}
.detail-handle{width:38px;height:4px;border-radius:999px;background:#d2dde1;margin:0 auto 10px}
.close{
  float:right;width:34px;height:34px;border:0;border-radius:12px;background:#eef3f5;cursor:pointer
}
.detail-kicker{font-size:8.6px;color:var(--blue);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.detail-title{font-size:22px;font-weight:900;letter-spacing:-.04em;margin-top:3px}
.detail-status{display:flex;align-items:center;gap:6px;margin:8px 0 12px;font-size:9.5px;font-weight:850}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.detail-box{background:#f2f7f8;border-radius:13px;padding:11px}
.detail-box span{font-size:7.6px;color:var(--muted);font-weight:800}
.detail-box b{display:block;font-size:18px;margin-top:3px}
.detail-note{margin-top:10px;background:#edf8fb;border-radius:13px;padding:11px;font-size:9.7px;line-height:1.5;color:#486875}
.detail-source{margin-top:9px;padding-top:9px;border-top:1px solid #edf1f3;font-size:8.5px;color:#758991;line-height:1.45}
.favorite-btn{
  width:100%;margin-top:10px;border:1px solid #cfe3eb;background:#f4fbfd;color:#117aa9;
  border-radius:13px;padding:11px;font-size:10px;font-weight:850;cursor:pointer
}

/* SEARCH */
.search-panel{
  position:absolute;z-index:1400;left:10px;right:10px;top:calc(60px + var(--safe-top));
  background:#fff;border:1px solid #dce7eb;border-radius:16px;padding:10px;
  box-shadow:0 10px 32px rgba(21,53,67,.18);display:none
}
.search-panel input{
  width:100%;border:1px solid #dce7eb;border-radius:12px;padding:12px 11px;font-size:16px;color:#173444
}
.search-results{display:grid;gap:5px;margin-top:8px;max-height:280px;overflow:auto}
.search-result{
  border:0;background:#f4f8fa;border-radius:11px;text-align:left;padding:9px;cursor:pointer
}
.search-result b{display:block;font-size:10px}
.search-result span{font-size:8px;color:#70838e}
.toast{
  position:absolute;z-index:1800;left:50%;bottom:84px;transform:translate(-50%,15px);
  background:rgba(18,43,55,.95);color:white;border-radius:999px;padding:8px 12px;
  font-size:8.5px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap
}

/* DESKTOP PREVIEW = PHONE */
@media (min-width:560px){
  body{display:grid;place-items:center}
  .app{width:min(430px,100vw);height:min(900px,100dvh);border-radius:28px;box-shadow:0 20px 70px rgba(25,55,67,.18)}
}
@media (max-width:360px){
  .brand-sub{display:none}
  .brand{padding-right:8px}
  .layer-btn{width:45px;height:45px}
  .sheet-title{font-size:16px}
}
</style>
</head>

<body>
<div class="app" id="app">
  <div id="map"></div>
  <div class="map-wash"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 16c3-5 6-5 9 0s6 5 9 0"/>
          <path d="M3 11c3-5 6-5 9 0s6 5 9 0"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Coastline</div>
        <div class="brand-sub">SoCal water conditions</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#31596f" stroke-width="2">
          <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
        </svg>
      </button>
      <button class="icon-btn" id="favoritesBtn" aria-label="Favorites">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#31596f" stroke-width="2">
          <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V21l-6-3.5L6 21z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="status-chip">
    <strong><i class="live-dot"></i> Prototype data</strong>
    <small>Live-data connection comes next</small>
  </div>

  <div class="layers" aria-label="Map layers">
    <button class="layer-btn active" data-layer="wind" aria-label="Wind layer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 8h10c2.5 0 2.5-4 0-4-1.4 0-2.2.7-2.5 1.6"/>
        <path d="M3 12h15c3 0 3 5 0 5-1.5 0-2.4-.8-2.7-1.8"/>
        <path d="M3 16h7"/>
      </svg>
      <span>WIND</span>
    </button>

    <button class="layer-btn" data-layer="swell" aria-label="Swell layer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M2 15c2.5-4 5-4 7.5 0s5 4 7.5 0 4.5-4 5 0"/>
        <path d="M2 10c2.5-4 5-4 7.5 0s5 4 7.5 0 4.5-4 5 0"/>
      </svg>
      <span>SWELL</span>
    </button>

    <button class="layer-btn" data-layer="fish" aria-label="Fishing conditions layer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M4 12c3.2-4.3 7.7-5.6 11.6-2.2 1.7-1.4 3.2-2 4.4-2.2-.2 2.3-.8 3.8-2 4.7 1.2 1 1.8 2.5 2 4.7-1.3-.2-2.9-.9-4.6-2.3C11.4 18 7 16.4 4 12Z"/>
        <circle cx="10.7" cy="10.5" r=".7" fill="currentColor" stroke="none"/>
      </svg>
      <span>FISH</span>
    </button>

    <button class="layer-btn" data-layer="tides" aria-label="Tide layer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M3 15c2-2.4 4-2.4 6 0s4 2.4 6 0 4-2.4 6 0"/>
        <path d="M12 3v8M9 6l3-3 3 3"/>
      </svg>
      <span>TIDES</span>
    </button>
  </div>

  <div class="search-panel" id="searchPanel">
    <input id="searchInput" type="search" placeholder="Search station, buoy, surf spot…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>

  <section class="sheet" id="sheet">
    <div class="handle" id="sheetHandle"><div class="grabber"></div></div>
    <div class="sheet-body">
      <div class="sheet-head">
        <div>
          <div class="eyebrow">Right now</div>
          <div class="sheet-title" id="sheetTitle">Surf + Wind</div>
          <div class="sheet-sub" id="sheetSub">Popular surf spots plus coastal wind stations</div>
        </div>
        <div class="mode">
          <button id="surfBtn" class="active" type="button">Surf</button>
          <button id="boatBtn" type="button">Boat</button>
        </div>
      </div>

      <div class="metrics" id="metrics"></div>

      <div class="section-head">
        <div>
          <strong id="sectionTitle">Wind stations</strong>
          <small id="sectionSub">Arrowhead points where the wind is blowing toward</small>
        </div>
        <button class="viewall" id="viewAllBtn" type="button">VIEW ALL</button>
      </div>

      <div class="regions" id="regions"></div>
      <div class="list" id="list"></div>
    </div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="map" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg>
      Map
    </button>
    <button class="nav-btn" data-nav="spots" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Spots
    </button>
    <button class="nav-btn" data-nav="forecast" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>
      Forecast
    </button>
    <button class="nav-btn" data-nav="more" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      More
    </button>
  </nav>

  <div class="modal" id="modal">
    <div class="detail">
      <div class="detail-handle"></div>
      <button class="close" id="closeDetail" type="button" aria-label="Close">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
   COASTLINE V6 TEST-DRIVE
   ---------------------------------------------------------
   This build uses sample observations so you can test the UI.
   The next step is replacing the sample values with cached
   NOAA / PORTS / approved PWS data from live.json.
========================================================= */

const COLORS = {
  green:"#24a861",
  yellow:"#e3c53d",
  orange:"#ee8b32",
  red:"#df4d52",
  blue:"#168bd0",
  gray:"#9aa8ae"
};

const REGIONS = ["All","LA / Long Beach","Orange County","San Diego"];

/* Meteorological direction is where wind comes FROM.
   The marker arrow points where the wind is blowing TOWARD. */
function windTowardDeg(fromDeg){
  return (Number(fromDeg) + 180) % 360;
}

function windColor(knots){
  const k = Number(knots);
  if(!Number.isFinite(k)) return COLORS.gray;
  if(k <= 9) return COLORS.green;
  if(k <= 16) return COLORS.yellow;
  if(k <= 24) return COLORS.orange;
  return COLORS.red;
}

function waveColor(feet){
  const f = Number(feet);
  if(!Number.isFinite(f)) return COLORS.gray;
  if(f < 2) return COLORS.green;
  if(f < 4) return COLORS.yellow;
  if(f < 6) return COLORS.orange;
  return COLORS.red;
}

function qualityColor(q){
  if(q==="Good") return COLORS.green;
  if(q==="Fair") return COLORS.yellow;
  if(q==="Poor") return COLORS.orange;
  if(q==="Hazardous") return COLORS.red;
  return COLORS.gray;
}

function cardinal(deg){
  const dirs=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  const d=((Number(deg)%360)+360)%360;
  return dirs[Math.round(d/22.5)%16];
}

/* -------------------- Wind stations -------------------- */
const windStations = [
  {

function loadSavedView(){
  try{
    const raw=localStorage.getItem("coastlineMapView");
    if(!raw) return null;
    const v=JSON.parse(raw);
    if(Array.isArray(v.center) && Number.isFinite(v.zoom)) return v;
  }catch(e){}
  return null;
}

const savedView = loadSavedView();
map = L.map("map",{zoomControl:false,attributionControl:true,preferCanvas:true})
  .setView(savedView?.center || defaultView.center, savedView?.zoom || defaultView.zoom);

L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",{
  attribution:"Tiles © Esri · GEBCO · NOAA", maxZoom:14
}).addTo(map);

map.on("moveend",()=>{
  try{
    const c=map.getCenter();
    localStorage.setItem("coastlineMapView",JSON.stringify({center:[c.lat,c.lng],zoom:map.getZoom()}));
  }catch(e){}
});

/* Try location on startup. If permission is denied/unavailable, keep saved/default view. */

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    map.setView([lat,lng],10.4);
    const icon=L.divIcon({className:"",iconSize:[16,16],iconAnchor:[8,8],html:'<div class="user-dot"></div>'});

    showToast("Map centered near your location");

}

/* -------------------- SVG marker helpers -------------------- */
function windSVG(fromDeg){
  const toDeg=windTowardDeg(fromDeg);
  return `
    <svg viewBox="0 0 24 24" style="transform:rotate(${toDeg}deg)">
      <path d="M12 19V5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M7.5 9.5 12 5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}
function waveSVG(){
  return `<svg viewBox="0 0 24 24">
    <path d="M3 9c2.3-2.8 4.6-2.8 6.9 0s4.6 2.8 6.9 0S21 6.2 22 8.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M3 15c2.3-2.8 4.6-2.8 6.9 0s4.6 2.8 6.9 0S21 12.2 22 14.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}
function fishSVG(){
  return `<svg viewBox="0 0 24 24">
    <path d="M4 12c3-4 7.4-5.4 11.3-2.2 1.7-1.4 3.3-2.1 4.7-2.3-.2 2.2-.9 3.8-2.1 4.5 1.2.9 1.9 2.4 2.1 4.6-1.4-.2-3-.9-4.7-2.3C11.4 17.5 7 16 4 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="10.4" cy="10.7" r=".9" fill="currentColor"/>
  </svg>`;
}
function surfSVG(){
  return `<svg viewBox="0 0 24 24">
    <circle cx="14.7" cy="5.5" r="2" fill="currentColor"/>
    <path d="M13 8.2 10.2 11l-3.8.7M13 8.2l3.2 2.6 2.6.3M11.2 10.2l2.1 4.1 3.2 2.5M8.4 17.4c3.8 1.5 7.2 1.2 10.3-.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 18.2c4.7 2 10 2.1 16-.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>`;
}
function tideSVG(trend){
  const up=String(trend).toLowerCase().includes("ris");
  return `<svg viewBox="0 0 24 24">
    <path d="M3 15c2-2.2 4-2.2 6 0s4 2.2 6 0 4-2.2 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M12 ${up? "4V11":"11V4"}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    <path d="${up?"M9.2 7 12 4l2.8 3":"M9.2 8 12 11l2.8-3"}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function markerIcon(kind,item,color,label=""){
  let inner="";
  if(kind==="wind") inner=windSVG(item.windFromDeg);
  if(kind==="wave") inner=waveSVG();
  if(kind==="fish") inner=fishSVG();
  if(kind==="surf") inner=surfSVG();
  if(kind==="tide") inner=tideSVG(item.trend);
  const html=`<div class="pin-wrap" style="--pin:${color}">
      <div class="pin-circle">${inner}</div>
      <div class="pin-tail"></div>
      ${label?`<div class="pin-speed">${label}</div>`:""}
    </div>`;
  return L.divIcon({className:"",iconSize:[38,48],iconAnchor:[19,37],html});
}

function clearMarkers(){
  mapMarkers.forEach(m=>map.removeLayer(m));
  mapMarkers=[];
}

function inRegion(item){ return region==="All" || item.region===region; }

function addMarker(item,kind,color,label,openFn){
  const m=L.marker([item.lat,item.lng],{icon:markerIcon(kind,item,color,label)}).addTo(map);
  m.bindTooltip(`<b>${item.name}</b><br>${item.id || ""}`,{direction:"top",offset:[0,-28],opacity:.97});
  m.on("click",()=>openFn(item));
  mapMarkers.push(m);
}

function drawMap(){
  clearMarkers();

  /* Surf spots remain visible on Surf mode except when Fish layer is active. */
  if(mode==="surf" && activeLayer!=="fish"){
    surfSpots.filter(inRegion).forEach(s=>{
      addMarker(s,"surf",qualityColor(s.quality),"",openSurf);
    });
  }

  if(activeLayer==="wind"){
    windStations.filter(inRegion).forEach(s=>{
      addMarker(s,"wind",windColor(s.windKt),`${Math.round(s.windKt)}kt`,openWind);
    });
  }
  if(activeLayer==="swell"){
    waveBuoys.filter(inRegion).forEach(s=>{
      addMarker(s,"wave",waveColor(s.waveFt),`${s.waveFt}'`,openWave);
    });
  }
  if(activeLayer==="fish"){
    fishingAreas.filter(inRegion).forEach(s=>{
      addMarker(s,"fish",qualityColor(s.rating),`${s.score}`,openFish);
    });
  }
  if(activeLayer==="tides"){
    tideStations.filter(inRegion).forEach(s=>{
      addMarker(s,"tide",COLORS.blue,"",openTide);
    });
  }
}

function layerList(){
  if(activeLayer==="wind") return windStations;
  if(activeLayer==="swell") return waveBuoys;
  if(activeLayer==="fish") return fishingAreas;
  return tideStations;
}

function regionBounds(r){
  if(r==="LA / Long Beach") return [[33.45,-118.75],[34.10,-117.95]];
  if(r==="Orange County") return [[33.30,-118.15],[33.78,-117.50]];
  if(r==="San Diego") return [[32.60,-117.80],[33.30,-117.10]];
  return [[32.55,-118.95],[34.20,-117.05]];
}

function setRegion(r){
  region=r;
  renderRegions(); renderList(); drawMap();
  map.fitBounds(regionBounds(r),{padding:[48,48],maxZoom:10.3});
}

function setLayer(layer){
  activeLayer=layer;
  document.querySelectorAll(".layer-btn").forEach(b=>b.classList.toggle("active",b.dataset.layer===layer));
  renderHeaderText(); renderMetrics(); renderList(); drawMap();
}

function setMode(next){
  mode=next;
  document.getElementById("surfBtn").classList.toggle("active",mode==="surf");
  document.getElementById("boatBtn").classList.toggle("active",mode==="boat");
  renderHeaderText(); renderMetrics(); renderList(); drawMap();
}

function renderHeaderText(){
  const title=document.getElementById("sheetTitle");
  const sub=document.getElementById("sheetSub");
  const section=document.getElementById("sectionTitle");
  const sectionSub=document.getElementById("sectionSub");

  const layerName={wind:"Wind",swell:"Swell",fish:"Fishing",tides:"Tides"}[activeLayer];
  title.textContent = mode==="surf" ? `Surf + ${layerName}` : `Boat + ${layerName}`;

  if(activeLayer==="wind"){
    sub.textContent=mode==="surf"?"Popular surf spots plus coastal wind stations":"Coastal, harbor and pier wind stations";
    section.textContent="Wind stations";
    sectionSub.textContent="Arrowhead points where the wind is blowing toward";
  }else if(activeLayer==="swell"){
    sub.textContent=mode==="surf"?"Popular surf spots plus wave-buoy conditions":"Wave buoys and sea-state observations";
    section.textContent="Wave buoys";
    sectionSub.textContent="Marker color is based on wave/seas height";
  }else if(activeLayer==="fish"){
    sub.textContent="Simple environmental fishing-condition overview";
    section.textContent="Fishing conditions";
    sectionSub.textContent="Prototype rating based on wind, seas, tide and pressure";
  }else{
    sub.textContent="Nearby tide stations and current tide stage";
    section.textContent="Tide stations";
    sectionSub.textContent="Tap a station for high/low tide details";
  }
}

function renderMetrics(){
  let values=[];
  if(activeLayer==="wind"){
    const items=windStations.filter(inRegion);
    const avg=items.length?items.reduce((a,b)=>a+b.windKt,0)/items.length:0;
    const max=items.length?Math.max(...items.map(x=>x.windKt)):0;
    values=[["AVG WIND",`${avg.toFixed(1)} kt`],["STRONGEST",`${max.toFixed(0)} kt`],["STATIONS",items.length],["LAYER","Wind"]];
  }else if(activeLayer==="swell"){
    const items=waveBuoys.filter(inRegion);
    const avg=items.length?items.reduce((a,b)=>a+b.waveFt,0)/items.length:0;
    const max=items.length?Math.max(...items.map(x=>x.waveFt)):0;
    values=[["AVG SEAS",`${avg.toFixed(1)} ft`],["HIGHEST",`${max.toFixed(1)} ft`],["BUOYS",items.length],["LAYER","Swell"]];
  }else if(activeLayer==="fish"){
    const items=fishingAreas.filter(inRegion);
    const best=items.length?Math.max(...items.map(x=>x.score)):0;
    values=[["BEST SCORE",best||"—"],["AREAS",items.length],["INPUTS","5"],["LAYER","Fish"]];
  }else{
    const items=tideStations.filter(inRegion);
    values=[["STATIONS",items.length],["RISING",items.filter(x=>x.trend==="Rising").length],["FALLING",items.filter(x=>x.trend==="Falling").length],["LAYER","Tides"]];
  }
  document.getElementById("metrics").innerHTML=values.map(v=>`<div class="metric"><span>${v[0]}</span><b>${v[1]}</b></div>`).join("");
}

function renderRegions(){
  document.getElementById("regions").innerHTML=REGIONS.map(r=>
    `<button class="region-pill ${r===region?"active":""}" data-region="${r}" type="button">${r}</button>`
  ).join("");
  document.querySelectorAll("[data-region]").forEach(b=>b.addEventListener("click",()=>setRegion(b.dataset.region)));
}

function badgeClass(status){
  if(status==="Good") return "good";
  if(status==="Fair") return "fair";
  if(status==="Poor") return "poor";
  if(status==="Hazardous") return "alert";
  return "neutral";
}

function renderList(){
  const items=layerList().filter(inRegion);
  const list=document.getElementById("list");

  if(!items.length){
    list.innerHTML=`<div class="row-card"><div><div class="row-name">No stations in this region yet</div><div class="row-sub">More locations can be added later.</div></div></div>`;
    return;
  }

  list.innerHTML=items.map((x,i)=>{
    if(activeLayer==="wind"){
      const level=x.windKt<=9?"Good":x.windKt<=16?"Fair":x.windKt<=24?"Poor":"Hazardous";
      return `<article class="row-card" data-row="${i}">
        <div><div class="row-name">${x.name}</div><div class="row-sub">${x.id} · ${x.sourceType}</div>
        <div class="row-data"><span>Wind <b>${x.windKt} kt</b></span><span>From <b>${cardinal(x.windFromDeg)}</b></span><span>Temp <b>${x.tempF}°F</b></span></div></div>
        <div class="badge ${badgeClass(level)}">${x.windKt} kt</div></article>`;
    }
    if(activeLayer==="swell"){
      const level=x.waveFt<2?"Good":x.waveFt<4?"Fair":x.waveFt<6?"Poor":"Hazardous";
      return `<article class="row-card" data-row="${i}">
        <div><div class="row-name">${x.name}</div><div class="row-sub">${x.id} · ${x.sourceType}</div>
        <div class="row-data"><span>Seas <b>${x.waveFt} ft</b></span><span>Period <b>${x.periodSec}s</b></span><span>Dir <b>${cardinal(x.waveDirDeg)}</b></span></div></div>
        <div class="badge ${badgeClass(level)}">${x.waveFt} ft</div></article>`;
    }
    if(activeLayer==="fish"){
      return `<article class="row-card" data-row="${i}">
        <div><div class="row-name">${x.name}</div><div class="row-sub">Fishing conditions · prototype score</div>
        <div class="row-data"><span>Wind <b>${x.wind}</b></span><span>Seas <b>${x.seas}</b></span><span>Tide <b>${x.tide}</b></span></div></div>
        <div class="badge ${badgeClass(x.rating)}">${x.rating}</div></article>`;
    }
    return `<article class="row-card" data-row="${i}">
      <div><div class="row-name">${x.name}</div><div class="row-sub">${x.id} · ${x.source}</div>
      <div class="row-data"><span>Height <b>${x.height}</b></span><span>Trend <b>${x.trend}</b></span></div></div>
      <div class="badge neutral">${x.trend}</div></article>`;
  }).join("");

  document.querySelectorAll("[data-row]").forEach((el)=>{
    const item=items[Number(el.dataset.row)];
    el.addEventListener("click",()=>{
      if(activeLayer==="wind") openWind(item);
      else if(activeLayer==="swell") openWave(item);
      else if(activeLayer==="fish") openFish(item);
      else openTide(item);
    });
  });
}

}
function closeDetail(){
  document.getElementById("modal").style.display="none";
  currentDetail=null;
}

  return `<div class="detail-source"><b>Source:</b> ${item.source || "Coastline prototype"}<br>

/* -------------------- Favorites -------------------- */
function favorites(){
  try{return JSON.parse(localStorage.getItem("coastlineFavorites")||"[]")}catch(e){return[]}
}
function toggleFavorite(item){
  if(!item?.id) return;
  let f=favorites();
  const exists=f.some(x=>x.id===item.id);
  if(exists) f=f.filter(x=>x.id!==item.id);
  else f.push({id:item.id,name:item.name,lat:item.lat,lng:item.lng});
  localStorage.setItem("coastlineFavorites",JSON.stringify(f));
  showToast(exists?"Removed from favorites":"Saved to favorites");
}
function showFavorites(){
  const f=favorites();
  if(!f.length){showToast("No favorites saved yet");return;}
  const html=f.map((x,i)=>`<button class="search-result" data-fav="${i}" type="button"><b>${x.name}</b><span>${x.id}</span></button>`).join("");
  document.getElementById("searchResults").innerHTML=html;
  document.getElementById("searchInput").value="";
  document.getElementById("searchInput").placeholder="Favorites";
  document.getElementById("searchPanel").style.display="block";
  document.querySelectorAll("[data-fav]").forEach(b=>b.addEventListener("click",()=>{
    const x=f[Number(b.dataset.fav)];
    if(Number.isFinite(x.lat)&&Number.isFinite(x.lng)) map.flyTo([x.lat,x.lng],11,{duration:.6});
    document.getElementById("searchPanel").style.display="none";
  }));
}

/* -------------------- Search -------------------- */
const allSearchItems = [
  ...windStations.map(x=>({...x,_kind:"wind"})),
  ...waveBuoys.map(x=>({...x,_kind:"wave"})),
  ...surfSpots.map(x=>({...x,_kind:"surf"})),
  ...fishingAreas.map(x=>({...x,_kind:"fish"})),
  ...tideStations.map(x=>({...x,_kind:"tide"}))
];
function runSearch(q){
  const query=q.trim().toLowerCase();
  const box=document.getElementById("searchResults");
  if(!query){box.innerHTML="";return;}
  const hits=allSearchItems.filter(x=>(x.name+" "+x.id+" "+x.region).toLowerCase().includes(query)).slice(0,12);
  box.innerHTML=hits.length?hits.map((x,i)=>`<button class="search-result" data-search="${i}" type="button"><b>${x.name}</b><span>${x.id || x._kind} · ${x.region}</span></button>`).join(""):`<div style="font-size:9px;color:#748792;padding:8px">No matches</div>`;
  document.querySelectorAll("[data-search]").forEach(b=>b.addEventListener("click",()=>{
    const x=hits[Number(b.dataset.search)];
    map.flyTo([x.lat,x.lng],11,{duration:.6});
    document.getElementById("searchPanel").style.display="none";
    if(x._kind==="wind") openWind(x);
    if(x._kind==="wave") openWave(x);
    if(x._kind==="surf") openSurf(x);
    if(x._kind==="fish") openFish(x);
    if(x._kind==="tide") openTide(x);
  }));
}

/* -------------------- Bottom sheet drag -------------------- */
const sheet=document.getElementById("sheet");
const handle=document.getElementById("sheetHandle");
let dragging=false,startY=0,startH=0;
function collapsedHeight(){return Math.min(210,window.innerHeight*.26)}
function midHeight(){return Math.min(430,window.innerHeight*.48)}
function expandedHeight(){return Math.min(650,window.innerHeight*.72)}
function setSheetHeight(h){sheet.style.setProperty("--sheet-h",`${Math.round(h)}px`)}
function collapseSheet(){setSheetHeight(collapsedHeight())}
function expandSheet(){setSheetHeight(expandedHeight())}
handle.addEventListener("pointerdown",e=>{
  dragging=true;startY=e.clientY;startH=sheet.getBoundingClientRect().height;
  sheet.classList.add("dragging");handle.setPointerCapture(e.pointerId);
});
handle.addEventListener("pointermove",e=>{
  if(!dragging)return;
  setSheetHeight(Math.max(156,Math.min(expandedHeight(),startH+(startY-e.clientY))));
});
handle.addEventListener("pointerup",()=>{
  if(!dragging)return;
  dragging=false;sheet.classList.remove("dragging");
  const h=sheet.getBoundingClientRect().height;
  const stops=[collapsedHeight(),midHeight(),expandedHeight()];
  stops.sort((a,b)=>Math.abs(h-a)-Math.abs(h-b));
  setSheetHeight(stops[0]);
});

/* -------------------- Buttons -------------------- */
document.querySelectorAll(".layer-btn").forEach(b=>b.addEventListener("click",()=>setLayer(b.dataset.layer)));
document.getElementById("surfBtn").addEventListener("click",()=>setMode("surf"));
document.getElementById("boatBtn").addEventListener("click",()=>setMode("boat"));
document.getElementById("viewAllBtn").addEventListener("click",expandSheet);
document.getElementById("closeDetail").addEventListener("click",closeDetail);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeDetail()});

document.getElementById("searchBtn").addEventListener("click",()=>{
  const p=document.getElementById("searchPanel");
  const open=p.style.display==="block";
  p.style.display=open?"none":"block";
  if(!open){
    document.getElementById("searchInput").placeholder="Search station, buoy, surf spot…";
    document.getElementById("searchInput").focus();
  }
});
document.getElementById("searchInput").addEventListener("input",e=>runSearch(e.target.value));
document.getElementById("favoritesBtn").addEventListener("click",showFavorites);

document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  const n=b.dataset.nav;
  if(n==="map") collapseSheet();
  if(n==="spots") expandSheet();
  if(n==="forecast") showToast("Forecast timeline is planned for a later build");
  if(n==="more") showToast("More tools are planned for a later build");
}));

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.opacity="1";t.style.transform="translate(-50%,0)";
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{t.style.opacity="0";t.style.transform="translate(-50%,15px)"},1500);
}

window.addEventListener("resize",()=>{
  setTimeout(()=>map.invalidateSize(),80);
  const h=sheet.getBoundingClientRect().height;
  if(h>expandedHeight()) setSheetHeight(expandedHeight());
});

/* Initial render */
renderHeaderText();
renderMetrics();
renderRegions();
renderList();
drawMap();
collapseSheet();
setTimeout(()=>map.invalidateSize(),120);
</script>
