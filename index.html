<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Coastline Live — West Coast</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#163242;--muted:#758995;--line:#dce8ec;--blue:#138ac7;--green:#25a861;--yellow:#e4c63f;--orange:#ee8a31;--red:#df4d52;--gray:#9ba9af;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#dfe9ec}
button,input{font:inherit}
.app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#bdd8e2}
#map{position:absolute;inset:0;background:#bdd8e2}
.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{font-size:7px!important;max-width:63vw;margin-bottom:77px!important;background:rgba(255,255,255,.72)!important}
.top{position:absolute;z-index:900;top:calc(8px + var(--safe-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.brand,.round{pointer-events:auto;background:rgba(255,255,255,.96);border:1px solid #d9e7ec;box-shadow:0 5px 18px rgba(20,53,68,.12);backdrop-filter:blur(14px)}
.brand{height:44px;border-radius:14px;padding:0 10px 0 7px;display:flex;align-items:center;gap:8px}
.brandmark{width:31px;height:31px;border-radius:10px;background:linear-gradient(145deg,#2ab5df,#0878b9);color:#fff;display:grid;place-items:center}
.brand b{font-size:13px;display:block;line-height:1} .brand small{font-size:8px;color:var(--muted)}
.actions{display:flex;gap:6px;pointer-events:auto}
.round{width:44px;height:44px;border:0;border-radius:14px;display:grid;place-items:center}
.livechip{position:absolute;z-index:790;top:calc(62px + var(--safe-top));left:10px;background:rgba(255,255,255,.94);border:1px solid #d8e6eb;border-radius:13px;padding:8px 10px;box-shadow:0 5px 18px rgba(20,53,68,.10);max-width:210px}
.livechip strong{font-size:9px;display:flex;gap:5px;align-items:center} .livechip small{font-size:7.5px;color:var(--muted);display:block;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.layers{position:absolute;z-index:850;right:10px;top:calc(66px + var(--safe-top));display:grid;gap:6px}
.layer{width:48px;height:48px;border:1px solid #d7e5ea;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 5px 16px rgba(20,53,68,.11);display:grid;place-items:center;padding:3px 0;color:#315668}
.layer.active{background:#e8f6fc;color:#087eb9;border-color:#b9dfef}
.layer svg{width:20px;height:20px;display:block} .layer span{font-size:6.5px;font-weight:900;line-height:1}
.pin{width:38px;height:45px;position:relative;filter:drop-shadow(0 4px 5px rgba(22,55,68,.18))}
.circle{position:absolute;left:4px;top:2px;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--c);color:var(--c);display:grid;place-items:center}
.tail{position:absolute;left:15px;top:29px;width:8px;height:8px;background:#fff;border-right:3px solid var(--c);border-bottom:3px solid var(--c);transform:rotate(45deg)}
.circle svg{width:18px;height:18px}
.mlabel{position:absolute;top:35px;left:50%;transform:translateX(-50%);font-size:6.7px;font-weight:900;color:#35515f;background:#fff;border:1px solid #dce7eb;border-radius:999px;padding:1px 4px;white-space:nowrap}
.cluster{background:#fff;border:3px solid #168bd0;color:#168bd0;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:10px;font-weight:900;box-shadow:0 4px 12px rgba(20,55,70,.2)}
.sheet{--h:212px;position:absolute;z-index:950;left:0;right:0;bottom:calc(64px + var(--safe-bottom));height:var(--h);min-height:158px;max-height:74dvh;background:rgba(252,254,255,.99);border:1px solid #dce8ec;border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(18,49,64,.14);overflow:hidden;transition:height .25s ease}
.sheet.dragging{transition:none}
.handle{height:27px;display:grid;place-items:center;touch-action:none} .grab{width:38px;height:4px;border-radius:999px;background:#ccd9de}
.body{height:calc(100% - 27px);overflow:auto;padding:0 12px 14px;scrollbar-width:none} .body::-webkit-scrollbar{display:none}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center}
.eyebrow{font-size:8px;font-weight:900;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}
.title{font-size:18px;font-weight:900;letter-spacing:-.035em;margin-top:2px} .sub{font-size:8.5px;color:var(--muted);margin-top:2px}
.mode{display:flex;background:#e9f0f3;border-radius:12px;padding:3px} .mode button{border:0;background:transparent;border-radius:9px;padding:7px 9px;font-size:9px;font-weight:900} .mode button.active{background:#fff;color:var(--blue);box-shadow:0 2px 7px rgba(25,55,68,.1)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}
.metric{background:#f1f6f8;border-radius:10px;padding:7px 6px;min-width:0} .metric span{font-size:6.8px;font-weight:850;color:#81919a;display:block;text-transform:uppercase} .metric b{font-size:11px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section{border-top:1px solid #edf2f4;padding-top:10px;display:flex;justify-content:space-between;gap:8px;align-items:center} .section strong{font-size:12px} .section small{font-size:8px;color:var(--muted);display:block;margin-top:2px}
.viewall{border:0;background:transparent;color:var(--blue);font-size:8px;font-weight:900;padding:7px}
.regions{display:flex;gap:6px;overflow:auto;padding:9px 0 8px;scrollbar-width:none} .regions::-webkit-scrollbar{display:none}
.regions button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:8px;font-weight:750;color:#627782} .regions button.active{background:#e5f4fb;color:#087db8;border-color:#bee3f2}
.list{display:grid;gap:7px;padding-bottom:10px} .card{background:#fff;border:1px solid #e1ebef;border-radius:15px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;box-shadow:0 3px 10px rgba(24,57,72,.045)} .card b{font-size:11px} .card small{display:block;font-size:8px;color:var(--muted);margin-top:2px} .facts{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;font-size:7.5px;color:#7a8d96} .facts strong{font-size:9px;color:#294756}
.badge{align-self:start;border-radius:999px;padding:5px 7px;font-size:7px;font-weight:900} .good{background:#e6f7ee;color:#11794b} .fair{background:#fff6d9;color:#956d00} .poor{background:#ffeddf;color:#a5520d} .bad{background:#fde8e9;color:#ad3439} .gray{background:#edf2f4;color:#687d87}
.nav{position:absolute;z-index:1100;left:0;right:0;bottom:0;height:calc(64px + var(--safe-bottom));padding:5px 10px var(--safe-bottom);background:rgba(255,255,255,.985);border-top:1px solid #dfe9ed;display:grid;grid-template-columns:repeat(4,1fr)} .nav button{border:0;background:transparent;border-radius:13px;display:grid;place-items:center;align-content:center;gap:2px;color:#80919a;font-size:8px;font-weight:850} .nav button.active{color:var(--blue);background:#edf8fc} .nav svg{width:18px;height:18px}
.modal{position:absolute;inset:0;z-index:1600;background:rgba(11,34,45,.28);display:none;align-items:flex-end} .detail{width:100%;max-height:87dvh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 14px calc(18px + var(--safe-bottom))} .dh{width:38px;height:4px;border-radius:999px;background:#d2dde1;margin:0 auto 10px} .close{float:right;width:34px;height:34px;border:0;border-radius:12px;background:#eef3f5} .dk{font-size:8px;font-weight:900;color:var(--blue);letter-spacing:.08em;text-transform:uppercase} .dt{font-size:22px;font-weight:900;letter-spacing:-.04em;margin-top:3px} .ds{font-size:9px;font-weight:800;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px} .box{background:#f2f7f8;border-radius:13px;padding:11px} .box span{font-size:7px;color:var(--muted);font-weight:800} .box b{font-size:17px;display:block;margin-top:3px} .note{margin-top:10px;background:#edf8fb;border-radius:13px;padding:11px;font-size:9px;line-height:1.5;color:#486875}
.search{position:absolute;z-index:1500;left:10px;right:10px;top:calc(60px + var(--safe-top));background:#fff;border:1px solid #dce7eb;border-radius:16px;padding:10px;box-shadow:0 10px 32px rgba(21,53,67,.18);display:none} .search input{width:100%;border:1px solid #dce7eb;border-radius:12px;padding:12px 11px;font-size:16px} .results{display:grid;gap:5px;margin-top:8px;max-height:300px;overflow:auto} .results button{border:0;background:#f4f8fa;border-radius:11px;text-align:left;padding:9px} .results b{display:block;font-size:10px} .results small{font-size:8px;color:#70838e}
.toast{position:absolute;z-index:1900;left:50%;bottom:84px;transform:translate(-50%,15px);background:rgba(18,43,55,.95);color:white;border-radius:999px;padding:8px 12px;font-size:8px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
@media(min-width:560px){body{display:grid;place-items:center}.app{width:min(430px,100vw);height:min(900px,100dvh);border-radius:28px;box-shadow:0 20px 70px rgba(25,55,67,.18)}}

/* ===== 7-DAY SWELL FORECAST SCREEN ===== */
.forecast-screen{
  position:absolute;inset:0;z-index:2200;background:#f5f9fa;
  display:none;overflow:auto;padding-bottom:calc(24px + var(--safe-bottom));
}
.forecast-top{
  position:sticky;top:0;z-index:5;
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-bottom:1px solid #dfe9ed;
  padding:calc(10px + var(--safe-top)) 12px 10px;
}
.forecast-head{display:flex;align-items:center;gap:10px}
.forecast-back{
  width:38px;height:38px;border:1px solid #dce7eb;border-radius:12px;
  background:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer
}
.forecast-head h1{font-size:18px;line-height:1.05;margin:0;letter-spacing:-.03em}
.forecast-head small{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.forecast-controls{
  margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px
}
.forecast-controls input{
  min-width:0;border:1px solid #d8e5ea;border-radius:12px;background:#fff;
  padding:11px 10px;font-size:15px;color:var(--ink)
}
.forecast-go{
  border:0;border-radius:12px;background:var(--blue);color:#fff;
  padding:0 13px;font-size:9px;font-weight:900;cursor:pointer
}
.forecast-content{padding:12px}
.forecast-location{
  background:#fff;border:1px solid #dfe9ed;border-radius:18px;padding:12px;
  box-shadow:0 3px 12px rgba(23,55,70,.05)
}
.forecast-location .place{font-size:21px;font-weight:900;letter-spacing:-.04em}
.forecast-location .meta{font-size:8px;color:var(--muted);margin-top:3px}
.tide-strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px
}
.tide-mini{background:#f1f6f8;border-radius:10px;padding:8px 6px;min-width:0}
.tide-mini span{display:block;font-size:6.7px;color:#7c909a;font-weight:850;text-transform:uppercase}
.tide-mini b{display:block;font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forecast-source{
  margin:9px 1px 0;font-size:7.7px;line-height:1.4;color:#758892
}
.forecast-loading{
  background:#fff;border:1px solid #dfe9ed;border-radius:16px;padding:18px;
  text-align:center;font-size:10px;color:#607783;margin-top:10px
}
.day-cards{display:grid;gap:9px;margin-top:10px}
.day-card{
  background:#fff;border:1px solid #dfe9ed;border-radius:18px;
  box-shadow:0 3px 12px rgba(23,55,70,.045);overflow:hidden
}
.day-summary{
  width:100%;border:0;background:#fff;padding:11px;text-align:left;
  display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:9px;align-items:center;cursor:pointer
}
.day-name b{display:block;font-size:11px}.day-name span{font-size:7px;color:var(--muted)}
.wave-summary b{font-size:17px;display:block;letter-spacing:-.03em}
.wave-summary small{font-size:7.5px;color:#71858f}
.confidence{
  font-size:6.8px;font-weight:900;border-radius:999px;padding:5px 7px;
  background:#edf4f7;color:#627b87;white-space:nowrap
}
.wave-bar{height:5px;background:#e8f0f3;border-radius:999px;margin-top:6px;overflow:hidden}
.wave-bar i{height:100%;display:block;background:var(--blue);border-radius:999px}
.day-detail{display:none;border-top:1px solid #edf2f4;padding:8px 9px 11px}
.day-card.open .day-detail{display:block}
.hour-row{
  display:grid;grid-template-columns:42px 1fr 1fr 1fr 1fr;gap:5px;
  padding:7px 2px;border-bottom:1px solid #f0f4f5;align-items:center
}
.hour-row:last-child{border-bottom:0}
.hour-row .time{font-size:8px;font-weight:900}
.hour-cell span{display:block;font-size:6.2px;color:#80929b;text-transform:uppercase;font-weight:800}
.hour-cell b{display:block;font-size:8px;margin-top:1px}
.forecast-note{
  margin-top:10px;background:#eaf7fb;border:1px solid #d1edf6;
  border-radius:14px;padding:10px;font-size:8px;line-height:1.5;color:#496b78
}
@media(max-width:360px){
  .hour-row{grid-template-columns:36px 1fr 1fr 1fr 1fr;gap:3px}
  .hour-cell b{font-size:7.4px}
}

</style>
</head>
<body>
<div class="app" id="app">
<div id="map"></div>

<header class="top">
  <div class="brand"><div class="brandmark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 16c3-5 6-5 9 0s6 5 9 0"/><path d="M3 11c3-5 6-5 9 0s6 5 9 0"/></svg></div><div><b>Coastline</b><small>West Coast live conditions</small></div></div>
  <div class="actions">
    <button class="round" id="searchBtn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#31596f" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    <button class="round" id="favBtn" aria-label="Favorites"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#31596f" stroke-width="2"><path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V21l-6-3.5L6 21z"/></svg></button>
  </div>
</header>

<div class="livechip"><strong><i class="dot" id="liveDot"></i><span id="liveText">Loading live data…</span></strong><small id="liveSub">NOAA / NDBC / CO-OPS</small></div>

<div class="layers">
<button class="layer active" data-layer="wind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10c2.5 0 2.5-4 0-4-1.4 0-2.2.7-2.5 1.6"/><path d="M3 12h15c3 0 3 5 0 5-1.5 0-2.4-.8-2.7-1.8"/><path d="M3 16h7"/></svg><span>WIND</span></button>
<button class="layer" data-layer="swell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 15c2.5-4 5-4 7.5 0s5 4 7.5 0 4.5-4 5 0"/><path d="M2 10c2.5-4 5-4 7.5 0s5 4 7.5 0 4.5-4 5 0"/></svg><span>SWELL</span></button>
<button class="layer" data-layer="fish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12c3.2-4.3 7.7-5.6 11.6-2.2 1.7-1.4 3.2-2 4.4-2.2-.2 2.3-.8 3.8-2 4.7 1.2 1 1.8 2.5 2 4.7-1.3-.2-2.9-.9-4.6-2.3C11.4 18 7 16.4 4 12Z"/><circle cx="10.7" cy="10.5" r=".7" fill="currentColor" stroke="none"/></svg><span>FISH</span></button>
<button class="layer" data-layer="tides"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 15c2-2.4 4-2.4 6 0s4 2.4 6 0 4-2.4 6 0"/><path d="M12 3v8M9 6l3-3 3 3"/></svg><span>TIDES</span></button>
<button class="layer" data-layer="stations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="2.2"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="7"/></svg><span>STATIONS</span></button>
</div>

<div class="search" id="search"><input id="q" type="search" placeholder="Search fishing area, station, surf spot…"><div class="results" id="results"></div></div>

<section class="sheet" id="sheet"><div class="handle" id="handle"><div class="grab"></div></div><div class="body">
<div class="head"><div><div class="eyebrow">LIVE WEST COAST</div><div class="title" id="title">Boat + Wind</div><div class="sub" id="sub">Latest official observations</div></div><div class="mode"><button id="surf">Surf</button><button id="boat" class="active">Boat</button></div></div>
<div class="metrics" id="metrics"></div>
<div class="section"><div><strong id="sectionTitle">Wind stations</strong><small id="sectionSub">Arrow points where wind is blowing toward</small></div><button class="viewall" id="viewall">VIEW ALL</button></div>
<div class="regions" id="regions"></div>
<div class="list" id="list"></div>
</div></section>

<nav class="nav">
<button class="active" data-nav="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg>Map</button>
<button data-nav="spots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Spots</button>
<button data-nav="forecast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>Forecast</button>
<button data-nav="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>More</button>
</nav>

<div class="modal" id="modal"><div class="detail"><div class="dh"></div><button class="close" id="close">✕</button><div id="detail"></div></div></div>
<div class="toast" id="toast"></div>

<div class="forecast-screen" id="forecastScreen">
  <div class="forecast-top">
    <div class="forecast-head">
      <button class="forecast-back" id="forecastBack" type="button" aria-label="Back">‹</button>
      <div>
        <h1>7-Day Swell Forecast</h1>
        <small>Forecast waves, swell, wind and tide trend</small>
      </div>
    </div>
    <div class="forecast-controls">
      <input id="forecastSpotInput" list="forecastSpotList" placeholder="Enter or choose a surf spot…" autocomplete="off">
      <datalist id="forecastSpotList"></datalist>
      <button class="forecast-go" id="forecastGo" type="button">VIEW</button>
    </div>
  </div>
  <div class="forecast-content" id="forecastContent"></div>
</div>

function friendlyName(x){
  const id=String(x.station||x.id||"");

  const raw=(x.name||"").trim();
  if(raw && !/^Station\s+[A-Z0-9-]+$/i.test(raw)) return raw;
  if(Number.isFinite(x.lat)&&Number.isFinite(x.lng)){
    let best=null,bd=Infinity;
    for(const p of FISHING){
      const d=dist(x,p);
      if(d<bd){bd=d;best=p}
    }
    if(best && bd<130) return best.name + (x.wave_ft!=null ? " Offshore" : " Coastal");
  }
  return x.wave_ft!=null ? "Offshore Wave Station" : "Coastal Weather Station";
}
function mapCenterDistanceMi(x){

function inViewport(x){

function nearestObs(p){let best=null,bd=1e9;for(const x of LIVE.ndbc){const d=dist(p,x);if(d<bd){bd=d;best=x}}return best?{...best,distance_km:bd}:null}

function fishInfo(p){
 const o=nearestObs(p),t=nearestTide(p);
 let score=60;
 if(o?.wind_kt!=null){score+=o.wind_kt<=9?15:o.wind_kt<=16?5:o.wind_kt<=24?-12:-28}
 if(o?.wave_ft!=null){score+=o.wave_ft<2?12:o.wave_ft<4?6:o.wave_ft<6?-8:-22}
 if(t?.trend) score+=4;
 score=Math.max(0,Math.min(100,Math.round(score)));
 const rating=score>=75?"Good":score>=55?"Fair":score>=35?"Poor":"Hazardous";
 return {score,rating,obs:o,tide:t};
}

function draw(){

}
function listData(){

 else if(layer==="tides") d=LIVE.tides.map(x=>({...x,region:regionOf(x.lat)})).filter(visible).filter(inViewport);

   if(layer==="wind") d=o.filter(x=>x.wind_kt!=null);

}

function openFish(x){open(`<div class="dk">FISHING CONDITIONS · EXPERIMENTAL</div><div class="dt">${x.name}</div><div class="ds">${x.region} · environmental score ${x.score}/100</div><div class="grid"><div class="box"><span>RATING</span><b>${x.rating}</b></div><div class="box"><span>WIND</span><b>${x.obs?.wind_kt!=null?x.obs.wind_kt.toFixed(1)+" kt":"—"}</b></div><div class="box"><span>SEAS</span><b>${x.obs?.wave_ft!=null?x.obs.wave_ft.toFixed(1)+" ft":"—"}</b></div><div class="box"><span>TIDE</span><b>${x.tide?.trend||"—"}</b></div><div class="box"><span>NEAREST OBS</span><b style="font-size:12px">${x.obs?.station||"—"}</b></div><div class="box"><span>DISTANCE</span><b>${x.obs?.distance_km!=null?(x.obs.distance_km*0.621371).toFixed(0)+" mi":"—"}</b></div></div><div class="note">This is a simple live environmental-conditions score using nearby wind, seas and tide information. It is not a fish-bite prediction and does not guarantee fishing success.</div>`)}
function openSurf(x){open(`<div class="dk">POPULAR SURF SPOT</div><div class="dt">${x.name}</div><div class="ds">${x.region}</div><div class="note">Popular surf-location marker. Live spot-quality modeling is not connected yet; use nearby Wind, Swell and Tides layers for current observations.</div>`)}

/* ===== FORECAST FEATURE ===== */
let FORECAST_CACHE=new Map();

function nearestSurfSpotToMap(){
  const c=map.getCenter();
  let best=SURF[0],bd=Infinity;
  for(const s of SURF){
    const d=dist({lat:c.lat,lng:c.lng},s);
    if(d<bd){bd=d;best=s}
  }
  return best;
}
function findSurfSpot(text){
  const q=(text||"").trim().toLowerCase();
  if(!q) return nearestSurfSpotToMap();
  return SURF.find(s=>s.name.toLowerCase()===q) ||
         SURF.find(s=>s.name.toLowerCase().includes(q)) ||
         SURF.find(s=>q.includes(s.name.toLowerCase())) || null;
}
function initForecastSpotList(){
  const dl=document.getElementById("forecastSpotList");
  dl.innerHTML=SURF.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(s=>`<option value="${s.name}">${s.region}</option>`).join("");
}
function openForecast(){
  const screen=document.getElementById("forecastScreen");
  const spot=nearestSurfSpotToMap();
  document.getElementById("forecastSpotInput").value=spot.name;
  screen.style.display="block";
  document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav==="forecast"));
  loadSpotForecast(spot);
}
function closeForecast(){
  document.getElementById("forecastScreen").style.display="none";
  document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav==="map"));
}
function feet(m){return m==null?null:m*3.2808399}
function fTemp(c){return c==null?null:c*9/5+32}
function n1(v){return v==null?"—":Number(v).toFixed(1)}
function tideTrend(arr,i){
  if(!arr||arr[i]==null)return"—";
  const before=arr[Math.max(0,i-1)],after=arr[Math.min(arr.length-1,i+1)];
  if(before==null||after==null)return"—";
  const delta=after-before;
  if(Math.abs(delta)<0.01)return"Slack";
  return delta>0?"Rising":"Falling";
}
function confidenceLabel(i){return i<=1?"Higher confidence":i<=4?"Moderate confidence":"Lower confidence"}
function formatDay(dateStr,i){
  const d=new Date(dateStr+"T12:00:00");
  const dow=d.toLocaleDateString([],{weekday:"short"}).toUpperCase();
  const md=d.toLocaleDateString([],{month:"short",day:"numeric"});
  return {dow,md,confidence:confidenceLabel(i)};
}
function nearestNoaaTideForSpot(spot){
  let best=null,bd=Infinity;
  for(const t of LIVE.tides||[]){
    if(!Number.isFinite(t.lat)||!Number.isFinite(t.lng))continue;
    const d=dist(spot,t);
    if(d<bd){bd=d;best=t}
  }
  return best?{...best,distance_mi:bd*0.621371}:null;
}
async function fetchForecastData(spot){
  const key=`${spot.lat.toFixed(3)},${spot.lng.toFixed(3)}`;
  const old=FORECAST_CACHE.get(key);
  if(old && Date.now()-old.when<15*60*1000)return old.data;

  const marineVars=[
    "wave_height","wave_direction","wave_period",
    "swell_wave_height","swell_wave_direction","swell_wave_period",
    "secondary_swell_wave_height","secondary_swell_wave_direction","secondary_swell_wave_period",
    "sea_surface_temperature","sea_level_height_msl"
  ].join(",");
  const dailyVars=[
    "wave_height_max","wave_direction_dominant","wave_period_max",
    "swell_wave_height_max","swell_wave_direction_dominant","swell_wave_period_max"
  ].join(",");
  const marineURL=`https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lng}&hourly=${marineVars}&daily=${dailyVars}&timezone=auto&forecast_days=7&cell_selection=sea`;
  const weatherURL=`https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lng}&hourly=wind_speed_10m,wind_direction_10m&daily=wind_speed_10m_max,wind_direction_10m_dominant&wind_speed_unit=kn&timezone=auto&forecast_days=7`;

  const [mr,wr]=await Promise.all([fetch(marineURL),fetch(weatherURL)]);
  if(!mr.ok)throw new Error("Marine forecast unavailable");
  if(!wr.ok)throw new Error("Wind forecast unavailable");
  const [marine,weather]=await Promise.all([mr.json(),wr.json()]);
  const data={marine,weather};
  FORECAST_CACHE.set(key,{when:Date.now(),data});
  return data;
}
function hourIndexesForDay(times,dateStr){
  const wanted=["06:00","09:00","12:00","15:00","18:00"];
  return wanted.map(h=>times.indexOf(`${dateStr}T${h}`)).filter(i=>i>=0);
}
function forecastTideHeader(spot){
  const t=nearestNoaaTideForSpot(spot);
  if(!t)return `
    <div class="tide-strip">
      <div class="tide-mini"><span>NOAA Tide</span><b>Not nearby</b></div>
      <div class="tide-mini"><span>Trend</span><b>—</b></div>
      <div class="tide-mini"><span>Next High</span><b>—</b></div>
      <div class="tide-mini"><span>Next Low</span><b>—</b></div>
    </div>`;
  const high=t.next_high?.time?new Date(t.next_high.time.replace(" ","T")+"Z").toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"—";
  const low=t.next_low?.time?new Date(t.next_low.time.replace(" ","T")+"Z").toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"—";
  return `
    <div class="tide-strip">
      <div class="tide-mini"><span>Current Tide</span><b>${t.height_ft!=null?n1(t.height_ft)+" ft":"—"}</b></div>
      <div class="tide-mini"><span>Going</span><b>${t.trend||"—"}</b></div>
      <div class="tide-mini"><span>Next High</span><b>${high}</b></div>
      <div class="tide-mini"><span>Next Low</span><b>${low}</b></div>
    </div>
    <div class="forecast-source">Nearest NOAA tide station: ${friendlyName(t)} (${t.station}) · about ${t.distance_mi.toFixed(0)} mi away.</div>`;
}
function renderForecast(spot,data){
  const m=data.marine,w=data.weather;
  const d=m.daily||{},h=m.hourly||{},wh=w.hourly||{},wd=w.daily||{};
  const days=d.time||[];
  let maxWave=0;
  for(const v of d.wave_height_max||[])if(v!=null)maxWave=Math.max(maxWave,feet(v));

  let html=`
    <div class="forecast-location">
      <div class="place">${spot.name}</div>
      <div class="meta">${spot.region} · 7-day marine-model forecast</div>
      ${forecastTideHeader(spot)}
    </div>
    <div class="forecast-note"><b>How to read this:</b> “Forecast Waves” is modeled significant wave height near the selected coastal point, not guaranteed breaking surf height on the beach. The tide trend in hourly rows is model-derived; the tide strip above uses the nearest available NOAA tide station.</div>
    <div class="day-cards">`;

  days.forEach((dateStr,di)=>{
    const fd=formatDay(dateStr,di);
    const wave=feet(d.wave_height_max?.[di]);
    const swell=feet(d.swell_wave_height_max?.[di]);
    const swellPeriod=d.swell_wave_period_max?.[di];
    const swellDir=d.swell_wave_direction_dominant?.[di];
    const windMax=wd.wind_speed_10m_max?.[di];
    const windDir=wd.wind_direction_10m_dominant?.[di];
    const bar=maxWave&&wave!=null?Math.max(8,Math.min(100,wave/maxWave*100)):10;
    const idxs=hourIndexesForDay(h.time||[],dateStr);

    html+=`
      <div class="day-card ${di===0?"open":""}">
        <button class="day-summary" type="button">
          <div class="day-name"><b>${fd.dow}</b><span>${fd.md}</span></div>
          <div class="wave-summary">
            <b>${wave!=null?n1(wave)+" ft":"—"}</b>
            <small>Forecast waves · Swell ${swell!=null?n1(swell)+" ft":"—"} @ ${swellPeriod!=null?Math.round(swellPeriod)+"s":"—"} ${swellDir!=null?card(swellDir):""}</small>
            <div class="wave-bar"><i style="width:${bar}%"></i></div>
          </div>
          <div class="confidence">${fd.confidence}</div>
        </button>
        <div class="day-detail">
          <div style="font-size:7.5px;color:#748994;margin:1px 2px 7px">Daily wind max: <b>${windMax!=null?n1(windMax)+" kt":"—"}</b> ${windDir!=null?card(windDir):""}</div>`;

    idxs.forEach(i=>{
      const tm=(h.time[i]||"").slice(11,16);
      const hour=Number(tm.slice(0,2));
      const label=hour===0?"12 AM":hour<12?hour+" AM":hour===12?"12 PM":(hour-12)+" PM";
      const waveFt=feet(h.wave_height?.[i]);
      const swellFt=feet(h.swell_wave_height?.[i]);
      const swellPer=h.swell_wave_period?.[i];
      const swellD=h.swell_wave_direction?.[i];
      const windI=(wh.time||[]).indexOf(h.time[i]);
      const windKt=windI>=0?wh.wind_speed_10m?.[windI]:null;
      const windD=windI>=0?wh.wind_direction_10m?.[windI]:null;
      const sst=fTemp(h.sea_surface_temperature?.[i]);
      const tt=tideTrend(h.sea_level_height_msl,i);
      html+=`
        <div class="hour-row">
          <div class="time">${label}</div>
          <div class="hour-cell"><span>Waves</span><b>${waveFt!=null?n1(waveFt)+" ft":"—"}</b></div>
          <div class="hour-cell"><span>Swell</span><b>${swellFt!=null?n1(swellFt)+"'":"—"} ${swellPer!=null?"@ "+Math.round(swellPer)+"s":""}<br>${swellD!=null?card(swellD):""}</b></div>
          <div class="hour-cell"><span>Wind</span><b>${windKt!=null?n1(windKt)+" kt":"—"}<br>${windD!=null?card(windD):""}</b></div>
          <div class="hour-cell"><span>Tide / SST</span><b>${tt}<br>${sst!=null?Math.round(sst)+"°F":"—"}</b></div>
        </div>`;
    });

    html+=`</div></div>`;
  });

  html+=`</div>
    <div class="forecast-source">Marine forecast: Open-Meteo model blend. Wind forecast: Open-Meteo weather model blend. Live tide strip: Coastline's cached NOAA CO-OPS data. Forecast/model data is for planning and testing, not navigation.</div>`;

  document.getElementById("forecastContent").innerHTML=html;
  document.querySelectorAll(".day-summary").forEach(btn=>btn.addEventListener("click",()=>btn.closest(".day-card").classList.toggle("open")));
}
async function loadSpotForecast(spot){
  const c=document.getElementById("forecastContent");
  c.innerHTML=`<div class="forecast-loading">Loading 7-day forecast for <b>${spot.name}</b>…</div>`;
  try{
    const data=await fetchForecastData(spot);
    renderForecast(spot,data);
  }catch(err){
    c.innerHTML=`<div class="forecast-loading"><b>Forecast could not load.</b><br><br>${err.message}<br><br>Check your internet connection and try again.</div>`;
  }
}

const sheet=document.getElementById("sheet"),handle=document.getElementById("handle");let drag=false,sy=0,sh=0;

handle.addEventListener("pointerdown",e=>{drag=true;sy=e.clientY;sh=sheet.getBoundingClientRect().height;sheet.classList.add("dragging");handle.setPointerCapture(e.pointerId)});handle.addEventListener("pointermove",e=>{if(drag)setH(Math.max(158,Math.min(expanded(),sh+sy-e.clientY)))});handle.addEventListener("pointerup",()=>{if(!drag)return;drag=false;sheet.classList.remove("dragging");const h=sheet.getBoundingClientRect().height,a=[collapsed(),mid(),expanded()].sort((x,y)=>Math.abs(h-x)-Math.abs(h-y));setH(a[0])});
